				<h3 class="epub-title">The Wolf and the Hunters</h3>
				<p>A Wolf devoured a sheep. The Hunters caught the Wolf and began to beat him. The Wolf said:</p>
				<p>“In vain do you beat me: it is not my fault that I am gray⁠—God has made me so.”</p>
				<p>But the Hunters said:</p>
				<p>“We do not beat the Wolf for being gray, but for eating the sheep.”</p>
