				</hgroup>
				<p>A farmer’s wife was annoyed by mice eating up the tallow in her cellar. She shut the cat into the cellar, so that the cat might catch the mice.</p>
				<p>But the cat ate up, not only the tallow, but the milk and the meat also.</p>
