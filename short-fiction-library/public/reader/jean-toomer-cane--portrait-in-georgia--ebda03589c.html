<div class="reader-prose"><article id="portrait-in-georgia" class="epub-z3998-poem">
			<h2 class="epub-title">Portrait in Georgia</h2>
			<p>
				<span>Hair⁠—braided chestnut,</span>
				<br>
				<span class="source-i2">coiled like a lyncher’s rope,</span>
				<br>
				<span>Eyes⁠—fagots,</span>
				<br>
				<span>Lips⁠—old scars, or the first red blisters,</span>
				<br>
				<span>Breath⁠—the last sweet scent of cane,</span>
				<br>
				<span>And her slim body, white as the ash</span>
				<br>
				<span class="source-i2">of black flesh after flame.</span>
			</p>
		</article></div>
