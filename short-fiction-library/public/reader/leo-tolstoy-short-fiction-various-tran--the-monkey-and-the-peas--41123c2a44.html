				<h3 class="epub-title">The Monkey and the Peas</h3>
				<p>A Monkey was carrying both her hands full of peas. A pea dropped on the ground; the Monkey wanted to pick it up, and dropped twenty peas. She rushed to pick them up and lost all the rest. Then she flew into a rage, swept away all the peas and ran off.</p>
